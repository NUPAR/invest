<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Bull &amp; Bear — Investing Simulator</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#0a0d13; --bg2:#0e121a; --panel:#121823; --panel2:#182030; --line:#212a3a; --line2:#2b3648; --grid:#1b2331;
  --text:#e7ecf5; --muted:#8a96ab; --dim:#5f6c82;
  --up:#20c787; --down:#f0506e; --accent:#5b8cff; --gold:#f2b84b; --violet:#a78bfa;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--text);font:13px/1.45 Inter,system-ui,"Segoe UI",sans-serif;-webkit-font-smoothing:antialiased}
.mono,.num,td,.px{font-family:"JetBrains Mono",ui-monospace,Consolas,monospace;font-variant-numeric:tabular-nums}
.up{color:var(--up)} .down{color:var(--down)} .muted{color:var(--muted)} .dim{color:var(--dim)}
button{font:inherit;color:inherit;cursor:pointer;background:none;border:0;padding:0}
input,select{font:inherit;color:var(--text);background:var(--bg2);border:1px solid var(--line2);border-radius:8px;padding:8px 10px;width:100%;outline:none}
input:focus,select:focus{border-color:var(--accent)}
a{color:var(--accent);cursor:pointer}
small{font-size:11px}

/* header */
header.top{position:sticky;top:0;z-index:20;display:flex;align-items:center;gap:22px;padding:10px 16px;background:rgba(10,13,19,.94);backdrop-filter:blur(8px);border-bottom:1px solid var(--line);flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:10px;min-width:190px}
.logo{width:36px;height:36px;border-radius:10px;display:grid;place-items:center;background:linear-gradient(135deg,#20c787,#5b8cff);color:#06101c;font-weight:800;font-size:13px}
.bname{font-weight:800;font-size:15px;letter-spacing:-.01em}
.bsub{font-size:11.5px;color:var(--muted)}
.kpis{display:flex;gap:26px;flex-wrap:wrap}
.kpi small{display:block;color:var(--muted);text-transform:uppercase;letter-spacing:.06em;font-size:10px;font-weight:600}
.kpi b{display:block;font-family:"JetBrains Mono",monospace;font-size:17px;font-weight:600;letter-spacing:-.02em}
.kpi span{font-family:"JetBrains Mono",monospace;font-size:11.5px}
.time{display:flex;gap:6px;align-items:center;margin-left:auto;flex-wrap:wrap}
.tbtn{height:32px;min-width:34px;padding:0 10px;border-radius:8px;border:1px solid var(--line2);background:var(--panel);font-weight:600;font-size:12px}
.tbtn:hover{border-color:var(--accent)}
.tbtn.play{background:var(--accent);border-color:var(--accent);color:#fff;min-width:42px}
.tbtn.play.on{background:var(--gold);border-color:var(--gold);color:#1a1200}
.progress{position:absolute;left:0;right:0;bottom:-1px;height:2px;background:transparent}
.progress i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--accent),var(--up))}
.status{font-size:11px;color:var(--muted);min-width:96px;text-align:right}

.macro{display:flex;gap:24px;padding:7px 16px;border-bottom:1px solid var(--line);background:var(--bg2);overflow-x:auto;white-space:nowrap;font-size:12px;scrollbar-width:none}
.macro>span small{color:var(--muted);margin-right:6px;font-size:11px}
.macro b{font-family:"JetBrains Mono",monospace;font-weight:500}
.macro i{font-style:normal;font-family:"JetBrains Mono",monospace;font-size:11px;margin-left:5px}

/* layout */
main{display:grid;grid-template-columns:290px minmax(0,1fr) 330px;gap:12px;padding:12px 16px 28px;max-width:1720px;margin:0 auto;align-items:start}
.col{display:flex;flex-direction:column;gap:12px;min-width:0}
.card{background:var(--panel);border:1px solid var(--line);border-radius:12px;min-width:0}
.cardh{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:10px 12px;border-bottom:1px solid var(--line);font-weight:600;font-size:11px;letter-spacing:.07em;text-transform:uppercase;color:var(--muted)}

.seg{display:inline-flex;background:var(--bg2);border:1px solid var(--line2);border-radius:8px;padding:2px;gap:2px}
.seg button{padding:4px 9px;border-radius:6px;color:var(--muted);font-size:11.5px;font-weight:600;text-transform:none;letter-spacing:0}
.seg button:hover{color:var(--text)}
.seg button.on{background:var(--panel2);color:var(--text);box-shadow:0 0 0 1px var(--line2)}

/* market list */
.mgrp{padding:7px 12px;font-size:10px;color:var(--dim);text-transform:uppercase;letter-spacing:.09em;background:var(--bg2);border-bottom:1px solid var(--line);font-weight:600}
.mrow{display:grid;grid-template-columns:minmax(0,1fr) 58px 78px;align-items:center;gap:8px;padding:8px 12px;border-bottom:1px solid #171e2b;cursor:pointer;user-select:none}
.mrow:hover{background:#151c29}
.mrow.sel{background:var(--panel2);box-shadow:inset 3px 0 0 var(--accent)}
.mrow .tk{font-weight:700;font-size:12.5px;display:flex;align-items:center;gap:6px}
.mrow .tk em{font-style:normal;width:6px;height:6px;border-radius:50%;background:var(--gold);display:inline-block}
.mrow .nm{font-size:11px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mrow .px{text-align:right;font-size:12px}
.mrow .px small{display:block;font-size:11px}
#mktList{max-height:calc(100vh - 170px);overflow:auto}

/* chart */
.chead{display:flex;align-items:center;gap:16px;padding:12px 14px 6px;flex-wrap:wrap}
.ctk{font-size:18px;font-weight:800;letter-spacing:-.01em;display:flex;gap:8px;align-items:center}
.badge{font-size:10px;font-weight:600;padding:2px 7px;border-radius:20px;background:var(--bg2);border:1px solid var(--line2);color:var(--muted);letter-spacing:.03em}
.cnm{color:var(--muted);font-size:12px}
.cpx b{font-family:"JetBrains Mono",monospace;font-size:20px;font-weight:600;display:block}
.cpx span{font-family:"JetBrains Mono",monospace;font-size:12px}
.chead .seg{margin-left:auto}
.chartwrap{position:relative;height:340px;padding:0 4px 6px}
.chartwrap canvas{width:100%;height:100%;display:block;cursor:crosshair}
.ctip{position:absolute;pointer-events:none;background:rgba(14,18,26,.96);border:1px solid var(--line2);border-radius:8px;padding:7px 9px;font-size:11.5px;display:none;z-index:3;white-space:nowrap;font-family:"JetBrains Mono",monospace;box-shadow:0 8px 24px rgba(0,0,0,.4)}
.legend{position:absolute;left:14px;top:4px;font-size:11px;color:var(--muted);display:flex;gap:12px;pointer-events:none}
.legend i{display:inline-block;width:12px;height:2px;vertical-align:middle;margin-right:5px}

/* info */
.infotop{padding:12px 14px;color:#c5cddb;font-size:12.5px;border-bottom:1px solid var(--line)}
.facts{display:grid;grid-template-columns:repeat(auto-fill,minmax(132px,1fr));overflow:hidden}
.fact{padding:9px 12px;border-right:1px solid var(--line);border-bottom:1px solid var(--line);margin-right:-1px}
.fact small{display:block;color:var(--muted);font-size:10.5px;margin-bottom:1px}
.fact b{font-family:"JetBrains Mono",monospace;font-weight:500;font-size:12.5px}
.infocols{display:grid;grid-template-columns:1fr 1fr;gap:0}
.infocols>div{padding:12px 14px;min-width:0}
.infocols>div+div{border-left:1px solid var(--line)}
.sub{font-size:10.5px;color:var(--muted);text-transform:uppercase;letter-spacing:.08em;font-weight:600;margin-bottom:8px}
.kv{display:flex;justify-content:space-between;gap:10px;padding:3px 0;font-size:12.5px}
.kv span:last-child{font-family:"JetBrains Mono",monospace}

/* tables */
.tbl{width:100%;border-collapse:collapse;font-size:12px}
.tbl th{color:var(--muted);font-weight:600;text-align:right;padding:8px 10px;border-bottom:1px solid var(--line);font-size:10px;text-transform:uppercase;letter-spacing:.06em;white-space:nowrap;font-family:Inter,sans-serif}
.tbl td{padding:7px 10px;text-align:right;border-bottom:1px solid #182030;white-space:nowrap}
.tbl th:first-child,.tbl td:first-child{text-align:left}
.tbl td small{color:var(--muted);font-family:Inter,sans-serif}
.tbl td.l{text-align:left}
.tbl tr[data-sel]{cursor:pointer}
.tbl tr[data-sel]:hover td{background:#151c29}
.tbl tr.sel td{background:var(--panel2)}
.tbl tr.tot td{font-weight:600;border-bottom:0}
.tbl.mini td,.tbl.mini th{padding:5px 6px}
.tscroll{overflow-x:auto}

.tabs{display:flex;gap:2px;padding:6px 8px 0;border-bottom:1px solid var(--line);overflow-x:auto}
.tabs button{padding:9px 12px;color:var(--muted);font-weight:600;font-size:12.5px;border-bottom:2px solid transparent;white-space:nowrap}
.tabs button.on{color:var(--text);border-bottom-color:var(--accent)}
#tabBody{max-height:520px;overflow:auto}
.empty{padding:28px 18px;color:var(--muted);text-align:center;line-height:1.7}
.alloc{padding:12px 14px;border-top:1px solid var(--line)}
.abar{display:flex;height:10px;border-radius:6px;overflow:hidden;background:var(--bg2);margin:6px 0 10px}
.abar i{display:block;height:100%}
.alegend{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:11.5px;color:var(--muted)}
.alegend span::before{content:"";display:inline-block;width:8px;height:8px;border-radius:2px;background:var(--c);margin-right:6px}

.statgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:1px;background:var(--line);border-top:1px solid var(--line)}
.stat{background:var(--panel);padding:10px 12px}
.stat small{display:block;color:var(--muted);font-size:10.5px}
.stat b{font-family:"JetBrains Mono",monospace;font-weight:500;font-size:14px}
.stat span{display:block;font-size:11px;color:var(--dim)}
.perfwrap{position:relative;height:270px;padding:6px 4px}
.perfwrap canvas{width:100%;height:100%;display:block;cursor:crosshair}
.perfbar{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:10px 12px 0;flex-wrap:wrap}
.note{font-size:11.5px;color:var(--dim);padding:8px 14px}

/* news */
.news{list-style:none;margin:0;padding:0}
.news li{display:grid;grid-template-columns:62px 8px minmax(0,1fr) auto;gap:10px;align-items:baseline;padding:8px 14px;border-bottom:1px solid #182030;font-size:12.5px}
.news .nd{color:var(--dim);font-size:11px;font-family:"JetBrains Mono",monospace}
.news .dot{width:7px;height:7px;border-radius:50%;background:var(--dim);display:inline-block;transform:translateY(-1px)}
.news .dot.up{background:var(--up)} .news .dot.down{background:var(--down)}
.chip{font-size:10.5px;font-weight:700;padding:1px 6px;border-radius:5px;background:var(--bg2);border:1px solid var(--line2);color:var(--muted);cursor:pointer;font-family:"JetBrains Mono",monospace}
.chip.own{color:var(--gold);border-color:#5a4720}
.news.compact li{grid-template-columns:8px minmax(0,1fr) auto;padding:7px 12px;font-size:12px}
.nf{display:flex;gap:8px;padding:10px 14px;border-bottom:1px solid var(--line)}

/* ticket */
.ticket .body{padding:12px;display:flex;flex-direction:column;gap:10px}
.sidesg{display:grid;grid-template-columns:1fr 1fr;background:var(--bg2);border:1px solid var(--line2);border-radius:9px;padding:3px;gap:3px}
.sidesg button{padding:7px;border-radius:7px;font-weight:700;color:var(--muted)}
.sidesg button.on[data-side=buy]{background:var(--up);color:#04140c}
.sidesg button.on[data-side=sell]{background:var(--down);color:#fff}
.ticket label{display:flex;flex-direction:column;gap:4px;font-size:11px;color:var(--muted);font-weight:600}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.quick{display:flex;gap:6px}
.quick button{flex:1;padding:5px;border:1px solid var(--line2);border-radius:7px;font-size:11.5px;color:var(--muted);font-weight:600}
.quick button:hover{color:var(--text);border-color:var(--accent)}
.est{margin:0;padding:8px 10px;background:var(--bg2);border-radius:9px;border:1px solid var(--line)}
.est div{display:flex;justify-content:space-between;padding:2px 0;font-size:12px}
.est dt{color:var(--muted)} .est dd{margin:0;font-family:"JetBrains Mono",monospace}
.hint{font-size:11.5px;color:var(--muted);line-height:1.5}
.hint.err{color:var(--down)}
.primary{width:100%;padding:11px;border-radius:9px;font-weight:700;background:var(--up);color:#04140c;font-size:13.5px}
.primary.sell{background:var(--down);color:#fff}
.primary:hover{filter:brightness(1.08)}
.order{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:9px 12px;border-bottom:1px solid #182030;font-size:12px}
.order b{font-weight:700}
.order .x{color:var(--muted);border:1px solid var(--line2);border-radius:6px;padding:2px 8px;font-size:11px}
.order .x:hover{color:var(--down);border-color:var(--down)}

/* modal */
.modalbg{position:fixed;inset:0;background:rgba(3,5,9,.74);backdrop-filter:blur(5px);display:none;align-items:center;justify-content:center;z-index:50;padding:16px}
.modalbg.show{display:flex}
.modal{background:var(--panel);border:1px solid var(--line2);border-radius:16px;max-width:640px;width:100%;max-height:calc(100vh - 32px);overflow:auto;padding:24px;box-shadow:0 30px 80px rgba(0,0,0,.55)}
.modal h1{margin:0 0 4px;font-size:24px;letter-spacing:-.02em}
.modal h2{font-size:14px;margin:20px 0 6px}
.modal p{color:#c3cbd9;margin:6px 0;line-height:1.6}
.modal ul{margin:6px 0;padding-left:18px;color:#c3cbd9;line-height:1.65}
.form{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin:16px 0}
.form label{display:flex;flex-direction:column;gap:5px;font-size:11.5px;color:var(--muted);font-weight:600}
.form label.chk{flex-direction:row;align-items:center;gap:8px;grid-column:1/-1}
.form label.chk input{width:auto}
.btns{display:flex;gap:10px;flex-wrap:wrap;margin-top:16px}
.btn{padding:10px 16px;border-radius:9px;border:1px solid var(--line2);font-weight:600;background:var(--panel2)}
.btn:hover{border-color:var(--accent)}
.btn.main{background:var(--accent);border-color:var(--accent);color:#fff}
.savebox{display:flex;justify-content:space-between;align-items:center;gap:12px;background:var(--bg2);border:1px solid var(--line2);border-radius:10px;padding:12px 14px;margin:14px 0}
.grade{font-size:18px;font-weight:800;margin:10px 0 2px}
.resgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:1px;background:var(--line);border:1px solid var(--line);border-radius:10px;overflow:hidden;margin:14px 0}
.resgrid div{background:var(--bg2);padding:10px 12px}
.resgrid small{display:block;color:var(--muted);font-size:10.5px}
.resgrid b{font-family:"JetBrains Mono",monospace;font-weight:600;font-size:15px}

/* toasts */
#toasts{position:fixed;right:16px;bottom:16px;display:flex;flex-direction:column-reverse;gap:8px;width:330px;max-width:calc(100vw - 32px);z-index:40;pointer-events:none}
.toast{background:rgba(20,26,38,.97);border:1px solid var(--line2);border-left:3px solid var(--accent);border-radius:10px;padding:9px 12px;box-shadow:0 10px 30px rgba(0,0,0,.45);animation:tin .3s ease-out;transition:opacity .35s,transform .35s}
.toast b{display:block;font-size:12.5px;margin-bottom:1px}
.toast span{font-size:12px;color:#c3cbd9}
.toast.good{border-left-color:var(--up)} .toast.bad{border-left-color:var(--down)} .toast.gold{border-left-color:var(--gold)}
.toast.out{opacity:0;transform:translateX(20px)}
@keyframes tin{from{opacity:0;transform:translateY(10px)}}

@media (max-width:1250px){
  main{grid-template-columns:260px minmax(0,1fr)}
  .col.right{grid-column:1/-1;display:grid;grid-template-columns:repeat(auto-fit,minmax(290px,1fr))}
}
@media (max-width:860px){
  main{grid-template-columns:minmax(0,1fr);padding:10px 16px 24px}
  #mktList{max-height:300px}
  .kpis{gap:16px}
  .kpi b{font-size:15px}
  .time{margin-left:0}
  .chartwrap{height:270px}
  .infocols{grid-template-columns:1fr}
  .infocols>div+div{border-left:0;border-top:1px solid var(--line)}
  .form{grid-template-columns:1fr}
  .resgrid{grid-template-columns:1fr 1fr}
  .news li{grid-template-columns:54px 8px minmax(0,1fr)}
  .news li .chip{display:none}
}
</style>
</head>
<body>
<header class="top">
  <div class="brand"><div class="logo">B&amp;B</div><div><div class="bname">Bull &amp; Bear</div><div class="bsub" id="dateLbl">—</div></div></div>
  <div class="kpis">
    <div class="kpi"><small>Account value</small><b id="kEq">—</b><span id="kEqCh"></span></div>
    <div class="kpi"><small>Cash</small><b id="kCash">—</b><span id="kBP" class="muted"></span></div>
    <div class="kpi" title="Time-weighted return: strips out the effect of your deposits so it compares fairly with the index"><small>Your return</small><b id="kRet">—</b><span id="kRetSub" class="muted"></span></div>
    <div class="kpi"><small>Market index</small><b id="kIdx">—</b><span id="kIdxCh"></span></div>
  </div>
  <div class="time">
    <span class="status" id="status">Paused</span>
    <button class="tbtn play" id="bPlay" data-act="play" title="Play / pause (Space)">▶</button>
    <div class="seg" id="speedSeg">
      <button data-speed="0" title="1 trading day per second">1×</button><button data-speed="1" title="3 days per second">3×</button><button data-speed="2" title="8 days per second">8×</button><button data-speed="3" title="20 days per second">20×</button>
    </div>
    <button class="tbtn" data-adv="1" title="Next trading day (→)">+1D</button>
    <button class="tbtn" data-adv="5">+1W</button>
    <button class="tbtn" data-adv="21">+1M</button>
    <button class="tbtn" data-act="help" title="How it works">?</button>
    <button class="tbtn" data-act="menu" title="Menu">☰</button>
  </div>
  <div class="progress"><i id="prog"></i></div>
</header>
<div class="macro" id="macroBar"></div>

<main>
  <div class="col">
    <div class="card">
      <div class="cardh">Markets <div class="seg"><button data-lf="all">All</button><button data-lf="held">Owned</button></div></div>
      <div id="mktList"></div>
    </div>
  </div>

  <div class="col">
    <div class="card">
      <div class="chead">
        <div><div class="ctk" id="cTk"></div><div class="cnm" id="cNm"></div></div>
        <div class="cpx"><b id="cPx"></b><span id="cCh"></span></div>
        <div class="seg" id="rangeSeg"><button data-range="1M">1M</button><button data-range="3M">3M</button><button data-range="6M">6M</button><button data-range="1Y">1Y</button><button data-range="5Y">5Y</button><button data-range="ALL">All</button></div>
      </div>
      <div class="chartwrap"><div class="legend" id="cLegend"></div><canvas id="chart"></canvas><div class="ctip" id="ctip"></div></div>
    </div>
    <div class="card" id="info"></div>
    <div class="card">
      <div class="tabs" id="tabs">
        <button data-tab="holdings">Holdings</button><button data-tab="perf">Performance</button><button data-tab="news">News</button><button data-tab="history">Activity</button><button data-tab="taxes">Taxes</button>
      </div>
      <div id="tabBody"></div>
    </div>
  </div>

  <div class="col right">
    <div class="card ticket">
      <div class="cardh">Trade ticket <span id="tTk" class="mono" style="color:var(--text)"></span></div>
      <div class="body">
        <div class="sidesg"><button data-side="buy" class="on">Buy</button><button data-side="sell">Sell</button></div>
        <label>Order type
          <select id="oType"><option value="market">Market — fill now</option><option value="limit">Limit — at my price or better</option><option value="stop">Stop — trigger at a price</option></select>
        </label>
        <div class="row2">
          <label>Shares <input id="oQty" type="number" min="1" step="1" placeholder="0" inputmode="numeric"></label>
          <label>Amount ($) <input id="oAmt" type="number" min="0" step="100" placeholder="0.00" inputmode="decimal"></label>
        </div>
        <label id="oPxWrap"><span id="oPxLbl">Limit price</span><input id="oPx" type="number" step="0.01" min="0" inputmode="decimal"></label>
        <div class="quick"><button data-q=".1">10%</button><button data-q=".25">25%</button><button data-q=".5">50%</button><button data-q="1">Max</button></div>
        <dl class="est" id="oEst"></dl>
        <div class="hint" id="oHint"></div>
        <button class="primary" id="oSubmit" data-act="submit">Buy</button>
      </div>
    </div>
    <div class="card"><div class="cardh">Open orders <span id="oCount"></span></div><div id="ordersList"></div></div>
    <div class="card"><div class="cardh">Latest headlines</div><ul class="news compact" id="miniNews"></ul></div>
  </div>
</main>

<div class="modalbg" id="modalBg"><div class="modal" id="modal"></div></div>
<div id="toasts"></div>

<script>
'use strict';
/* ======================= utilities ======================= */
const $=(s,r=document)=>r.querySelector(s), $$=(s,r=document)=>[...r.querySelectorAll(s)];
const clamp=(x,a,b)=>x<a?a:x>b?b:x;

      const r=s.beta*f+sf[s.sec]+s.oil*oilR+s.rate*dy+pull+idioS*R.t()+jump;
      s.sigD=Math.sqrt((s.beta*sig)**2+idioS**2);
      this.bar(s,prev-div,r,jump,s.sigD,jump!==0?2.5:1);
      s.E.push(s.eps);s.divToday=div;
      if(er){er.react=(s.C[d]+div)/prev-1;er.n.tone=er.react>.005?1:er.react<-.005?-1:0;er.n.big=Math.abs(er.react)>.08}
    }
    /* broad market (thousands of stocks) and the index fund that tracks it */
    const rm=f+.0012*R.n();
    const dyI=clamp(.018*fairIdx/this.idx,.008,.04);
    this.idx*=Math.exp(rm-dyI/252);
    {const I=this.map.IDXF,prev=I.C[d-1],expd=I.er/252;I.accr+=prev*dyI/252;let dist=0;
     if(newMonth&&mo%3===2&&I.accr>0){dist=round2(I.accr);I.accr=0;I.divs.push({d,amt:dist})}
     I.sigD=sig;this.bar(I,prev-dist,rm-expd,0,sig,1);I.divToday=dist;this.tr*=Math.exp(rm-expd)}
    /* bond fund */
    {const B=this.map.BNDF,prev=B.C[d-1];this.yb=this.y10-.3+this.credit*.5;const dyb=dy+dCr*.5;
     B.accr+=prev*this.yb/100/252;let dist=0;
     if(newMonth&&B.accr>0){dist=round2(B.accr);B.accr=0;B.divs.push({d,amt:dist})}
     const rb=-B.dur*dyb/100+this.yb/100/252-B.er/252+.0006*R.n();
     B.sigD=.004;this.bar(B,prev-dist,rb,0,.004,1);B.divToday=dist}
    /* gold */
    {const G=this.map.GLDF,prev=G.C[d-1];
     const rg=.03/252-G.er/252+.0085*Math.sqrt(this.volMult)*R.t()-.1*f-.02*dy-.3*crash;
     G.sigD=.0085*Math.sqrt(this.volMult);this.bar(G,prev,rg,0,G.sigD,crash?2:1);G.divToday=0}
    this.record();
  }
}
/*SIM-END*/

/* ======================= game state ======================= */
const SPEEDS=[1,3,8,20];
const RANGES={'1M':21,'3M':63,'6M':126,'1Y':252,'5Y':1260};
const TAX={st:.24,lt:.15,div:.15,ord:.24};
const SAVE_KEY='bullbear_save_v1';
let M=null,P=null,S=null;
const G={startDay:0,sel:'IDXF',range:'6M',tab:'holdings',side:'buy',speed:1,playing:false,dirty:true,hov:null,phov:null,perfMode:'ret',newsF:'all',listF:'all',demo:false,pdAt:0,modal:false};

function held(t){const l=P.lots[t];if(!l)return 0;let q=0;for(const x of l)q+=x.q;return q}
function basis(t){const l=P.lots[t];if(!l)return 0;let c=0;for(const x of l)c+=x.q*x.p;return c}
function price(t){return M.map[t].C[M.day]}
function longValue(){let v=0;for(const t in P.lots)v+=held(t)*price(t);return v}
function equity(){return P.cash+longValue()}
function buyingPower(){if(S.margin)return Math.max(0,longValue()+2*P.cash);return Math.max(0,P.cash)}
function reservedSells(t){let q=0;for(const o of P.orders)if(o.t===t&&o.side==='sell')q+=o.qty;return q}
function execPx(s,side,qty,ref){const half=s.spr/2/1e4*(.6+.4*M.volMult);const imp=.4*s.sigD*Math.sqrt(Math.max(0,qty)/s.adv);const sl=half+imp;return round2(ref*(side==='buy'?1+sl:1-sl))}
function addTx(o){P.tx.push(Object.assign({d:M.day},o));if(P.tx.length>1500)P.tx.splice(0,P.tx.length-1500)}

function buy(t,qty,px,ref,note){
  P.cash-=qty*px;(P.lots[t]||(P.lots[t]=[])).push({q:qty,p:px,d:M.day});
  P.costs+=Math.max(0,px-ref)*qty;P.trades++;
  addTx({type:'BUY',t,qty,px,amt:-qty*px,note});
}
function sell(t,qty,px,ref,note){
  const lots=P.lots[t]||[];let rem=qty,st=0,lt=0;const now=M.dates[M.day];
  while(rem>0&&lots.length){const l=lots[0],q=Math.min(rem,l.q),g=q*(px-l.p);if(now-M.dates[l.d]>365*DAY_MS)lt+=g;else st+=g;l.q-=q;rem-=q;if(l.q<=0)lots.shift()}
  if(!lots.length)delete P.lots[t];
  const gross=qty*px,fee=round2(gross*.0000278);
  P.cash+=gross-fee;st-=fee;
  P.yr.st+=st;P.yr.lt+=lt;P.realized+=st+lt;
  P.costs+=fee+Math.max(0,ref-px)*qty;P.trades++;P.sells++;if(st+lt>0)P.wins++;
  addTx({type:'SELL',t,qty,px,amt:gross-fee,gain:st+lt,note});
  return st+lt;
}

function taxCalc(y,carry){
  let st=y.st+carry,lt=y.lt;
  if(st<0&&lt>0){const k=Math.min(-st,lt);st+=k;lt-=k}
  if(lt<0&&st>0){const k=Math.min(-lt,st);lt+=k;st-=k}
  const loss=Math.min(0,st)+Math.min(0,lt),ded=Math.max(loss,-3000);
  const tax=Math.max(0,round2(Math.max(0,st)*TAX.st+Math.max(0,lt)*TAX.lt+y.div*TAX.div+y.int*TAX.ord+ded*TAX.ord));
  return {tax,carryOut:loss-ded,st,lt,ded};
}
function settleTaxes(year,evs){
  const y=P.yr,rec={yr:year,st:y.st,lt:y.lt,div:y.div,int:y.int,tax:0};
  if(S.acct==='taxable'){
    const c=taxCalc(y,P.carry);P.carry=c.carryOut;rec.tax=c.tax;rec.carry=c.carryOut;
    if(c.tax>0){P.cash-=c.tax;P.taxPaid+=c.tax;addTx({type:'TAX',amt:-c.tax,note:`${year} tax bill`});evs.push({t:`${year} taxes paid: ${fmt$(c.tax)}`,b:`Deducted from cash. Gains held longer than a year are taxed at 15% instead of 24%.`,k:'gold'})}
    else evs.push({t:`${year} taxes: nothing owed`,b:c.carryOut<0?`${fmt$(-c.carryOut)} of capital losses carries forward to offset future gains.`:'No taxable gains or income this year.',k:'info'});
  }
  P.taxes.push(rec);P.yr={st:0,lt:0,div:0,int:0};
}
function marginCheck(evs){
  if(P.cash>=0)return;
  const L=longValue();if(L<=0)return;
  const E=L+P.cash;
  if(E>=.25*L){if(E<.3*L&&!P.mWarn){P.mWarn=true;evs.push({t:'Margin warning',b:`Your equity is ${fmtPct(E/L,0,false)} of holdings. Below 25% the broker will sell for you.`,k:'gold'})}if(E>=.35*L)P.mWarn=false;return}
  const need=Math.min(L,L-E/.30+1),frac=Math.min(1,need/L);
  for(const t of Object.keys(P.lots)){const sh=held(t),q=Math.min(sh,Math.ceil(sh*frac));if(q>0){const s=M.map[t],ref=s.C[M.day];sell(t,q,execPx(s,'sell',q,ref),ref,'Margin call liquidation')}}
  P.calls++;P.mWarn=false;
  evs.push({t:'MARGIN CALL',b:`Equity fell below the 25% maintenance requirement. Your broker force-sold about ${fmt$(need,0)} of your holdings at market prices.`,k:'bad',pause:true});
}
function processOrders(evs){
  const d=M.day,keep=[];
  for(const o of P.orders){
    const s=M.map[o.t],O=s.O[d],H=s.H[d],L=s.L[d];let ref=null;
    const below=o.type==='limit'?o.side==='buy':o.side==='sell';
    if(below){if(O<=o.px)ref=O;else if(L<=o.px)ref=o.px}else{if(O>=o.px)ref=O;else if(H>=o.px)ref=o.px}
    if(ref===null){keep.push(o);continue}
    let px=execPx(s,o.side,o.qty,ref);
    if(o.type==='limit')px=o.side==='buy'?Math.min(px,o.px):Math.max(px,o.px);
    const name=o.type==='stop'?(o.side==='sell'?'Stop-loss':'Buy stop'):'Limit order';
    if(o.side==='buy'){
      if(o.qty*px>buyingPower()+.005){evs.push({t:`${name} cancelled`,b:`Not enough buying power to buy ${o.qty} ${o.t} at ${fmt$(px)}.`,k:'bad'});continue}
      buy(o.t,o.qty,px,ref,name);evs.push({t:`${name} filled`,b:`Bought ${o.qty} ${o.t} @ ${fmt$(px)}`,k:'good'});
    }else{
      const q=Math.min(o.qty,held(o.t));
      if(q<=0){evs.push({t:`${name} cancelled`,b:`You no longer hold ${o.t}.`,k:'info'});continue}
      const g=sell(o.t,q,px,ref,name);
      evs.push({t:`${name} filled`,b:`Sold ${q} ${o.t} @ ${fmt$(px)}${o.type==='stop'&&O<o.px?' (gapped below your stop)':''} · ${g>=0?'gain':'loss'} ${sgn$(g)}`,k:g>=0?'good':'bad'});
    }
  }
  P.orders=keep;
}

/* one trading day */
function advance(live){
  if(!P||P.over)return false;
  M.step();
  const d=M.day,dt=new Date(M.dates[d]),pd=new Date(M.dates[d-1]);
  const newMonth=dt.getUTCMonth()!==pd.getUTCMonth(),newYear=dt.getUTCFullYear()!==pd.getUTCFullYear();
  const evs=[];
  const days=(M.dates[d]-M.dates[d-1])/DAY_MS;
  if(P.cash>0){const i=P.cash*Math.max(0,M.fed-.5)/100/365*days;P.cash+=i;P.yr.int+=i;P.intTotal+=i}
  else if(P.cash<0){const i=-P.cash*(M.fed+2.5)/100/360*days;P.cash-=i;P.marginInt+=i}
  if(newYear)settleTaxes(pd.getUTCFullYear(),evs);
  if(newMonth&&S.contrib>0){const u=P.uHist[P.uHist.length-1];P.cash+=S.contrib;P.units+=S.contrib/u;P.contrib+=S.contrib;P.twin+=S.contrib;addTx({type:'DEPOSIT',amt:S.contrib,note:'Monthly savings'})}
  P.twin*=M.H.tr[d]/M.H.tr[d-1];
  let divSum=0;
  for(const s of M.secs)if(s.divToday>0){const sh=held(s.t);if(sh>0){const a=sh*s.divToday;P.cash+=a;P.yr.div+=a;P.divTotal+=a;divSum+=a;addTx({type:'DIV',t:s.t,qty:sh,px:s.divToday,amt:a,note:s.kind==='stock'?'Dividend':'Fund distribution'})}}
  if(divSum>=1)evs.push({t:'Dividends received',b:`${sgn$(divSum)} paid into your cash balance`,k:'good',minor:true});
  processOrders(evs);
  marginCheck(evs);
  const eq=equity();
  if(eq<=0){P.over=true;P.uHist.push(0);P.eqHist.push(eq);P.cHist.push(P.contrib);P.twHist.push(P.twin);if(live){pause();showEnd(true)}return false}
  P.uHist.push(eq/P.units);P.eqHist.push(eq);P.cHist.push(P.contrib);P.twHist.push(P.twin);
  if(live){
    let pz=false;
    for(const n of M.today){
      const own=n.t&&held(n.t)>0;
      if(n.crash){evs.push({t:'Market crash',b:n.txt,k:'bad',pause:true});continue}
      if(n.big||own)evs.push({t:n.t?`${n.t} · ${n.k==='earn'?'Earnings':'News'}`:'Market news',b:n.txt,k:n.tone>0?'good':n.tone<0?'bad':'info',minor:!n.big&&!own});
    }
    for(const e of evs){if(e.minor&&G.playing&&SPEEDS[G.speed]>=8)continue;toast(e.t,e.b,e.k);if(e.pause&&S.autoPause)pz=true}
    if(pz){pause();G.pauseReq=true}
    if(S.years>0&&!P.ended&&M.dates[d]-M.dates[G.startDay]>=S.years*365.25*DAY_MS){P.ended=true;pause();showEnd(false)}
    if((d-G.startDay)%21===0)save();
  }
  G.dirty=true;return true;
}

/* ======================= save / load / new ======================= */
function save(){if(!P||G.demo)return;try{localStorage.setItem(SAVE_KEY,JSON.stringify({v:1,S,day:M.day,startDay:G.startDay,P,sel:G.sel}))}catch(e){}}
function readSave(){try{const r=localStorage.getItem(SAVE_KEY);if(!r)return null;const s=JSON.parse(r);return s&&s.v===1?s:null}catch(e){return null}}
function loadGame(sv){
  S=sv.S;M=new Market(S.seed);while(M.day<sv.day)M.step();
  G.startDay=sv.startDay;P=sv.P;G.sel=M.map[sv.sel]?sv.sel:'IDXF';G.demo=false;G.dirty=true;
}
function newGame(o,demo){
  S={cash:o.cash,years:o.years,contrib:o.contrib,acct:o.acct,margin:o.acct==='taxable'&&o.margin,autoPause:true,seed:o.seed>>>0};
  M=new Market(S.seed);while(M.day<WARMUP)M.step();
  G.startDay=M.day;G.demo=!!demo;G.sel='IDXF';G.tab='holdings';
  P={cash:o.cash,lots:{},orders:[],tx:[],oid:1,yr:{st:0,lt:0,div:0,int:0},carry:0,taxPaid:0,taxes:[],contrib:o.cash,units:o.cash/100,
     uHist:[100],eqHist:[o.cash],cHist:[o.cash],twin:o.cash,twHist:[o.cash],divTotal:0,intTotal:0,marginInt:0,costs:0,realized:0,trades:0,wins:0,sells:0,calls:0,over:false,ended:false};
  addTx({type:'DEPOSIT',amt:o.cash,note:'Opening deposit'});
  G.dirty=true;resetTicket();
  if(!demo)save();
}

/* ======================= stats ======================= */
function stats(){
  const sd=G.startDay,d=M.day,u=P.uHist,n=u.length,TR=M.H.tr;
  const yrs=(M.dates[d]-M.dates[sd])/(365.25*DAY_MS);
  const twr=u[n-1]/100-1,btwr=TR[d]/TR[sd]-1;
  const cagr=yrs>=.25?Math.pow(Math.max(0,1+twr),1/yrs)-1:NaN,bcagr=yrs>=.25?Math.pow(1+btwr,1/yrs)-1:NaN;
  let k=0,m=0,mb=0;const r=[],b=[];
  for(let i=1;i<n;i++){const x=u[i]/u[i-1]-1,y=TR[sd+i]/TR[sd+i-1]-1;r.push(x);b.push(y);m+=x;mb+=y;k++}
  let vol=NaN,bvol=NaN,beta=NaN,sharpe=NaN;
  if(k>=20){m/=k;mb/=k;let v=0,vb=0,c=0;for(let i=0;i<k;i++){v+=(r[i]-m)**2;vb+=(b[i]-mb)**2;c+=(r[i]-m)*(b[i]-mb)}
    vol=Math.sqrt(v/(k-1)*252);bvol=Math.sqrt(vb/(k-1)*252);beta=vb>0?c/vb:NaN;
    let rf=0;for(let i=sd;i<=d;i++)rf+=Math.max(0,M.H.fed[i]-.5);rf/=(d-sd+1)*100;
    sharpe=vol>0?(m*252-rf)/vol:NaN}
  const mdd=a=>{let pk=-Infinity,dd=0;for(const x of a){if(x>pk)pk=x;const q=x/pk-1;if(q<dd)dd=q}return dd};
  const eq=P.eqHist[P.eqHist.length-1];
  return {yrs,twr,btwr,cagr,bcagr,vol,bvol,beta,sharpe,mdd:mdd(u),bmdd:mdd(TR.slice(sd,d+1)),eq,profit:eq-P.contrib,twin:P.twin};
}

/* ======================= rendering helpers ======================= */
const C={};
function readColors(){const cs=getComputedStyle(document.documentElement);for(const k of['up','down','accent','gold','muted','dim','text','line','grid','panel','violet'])C[k]=cs.getPropertyValue('--'+k).trim();C.upA='rgba(32,199,135,.32)';C.downA='rgba(240,80,110,.32)'}
function setHTML(el,h){if(el&&el._h!==h){el.innerHTML=h;el._h=h}}
function setupCanvas(cv){const r=cv.getBoundingClientRect(),dpr=window.devicePixelRatio||1,w=Math.max(10,Math.round(r.width)),h=Math.max(10,Math.round(r.height));if(cv.width!==w*dpr||cv.height!==h*dpr){cv.width=w*dpr;cv.height=h*dpr}const ctx=cv.getContext('2d');ctx.setTransform(dpr,0,0,dpr,0,0);ctx.clearRect(0,0,w,h);return{ctx,w,h}}
function axisFmt(v,step){return step<1?v.toFixed(2):step<10?v.toFixed(1):Math.round(v).toLocaleString('en-US')}
function dateLabels(ctx,a,b,X,y,plotW,dateOf,x0){
  const n=b-a+1,target=Math.max(2,Math.floor(plotW/105)),st=Math.max(1,Math.ceil(n/target));
  const span=(dateOf(b)-dateOf(a))/DAY_MS;
  ctx.fillStyle=C.dim;ctx.textAlign='center';ctx.textBaseline='alphabetic';ctx.font='10.5px Inter, sans-serif';
  for(let i=b;i>=a;i-=st){const x=X(i);if(x<x0+28)break;ctx.fillText(span>420?fmtDate(dateOf(i),{month:'short',year:'2-digit'}).replace(' ',' ’'):fmtDate(dateOf(i),{month:'short',day:'numeric'}),x,y)}
}
function spark(arr,a,b,w,h){
  let lo=Infinity,hi=-Infinity;for(let i=a;i<=b;i++){if(arr[i]<lo)lo=arr[i];if(arr[i]>hi)hi=arr[i]}
  const pts=[];for(let i=a;i<=b;i++)pts.push(((i-a)/(b-a)*w).toFixed(1)+','+(h-(arr[i]-lo)/((hi-lo)||1)*h).toFixed(1));
  return `<svg width="${w}" height="${h}" viewBox="0 -1 ${w} ${h+2}"><polyline fill="none" stroke="${arr[b]>=arr[a]?C.up:C.down}" stroke-width="1.3" stroke-linejoin="round" points="${pts.join(' ')}"/></svg>`;
}

/* ---------- price chart ---------- */
function drawPriceChart(){
  const cv=$('#chart'),{ctx,w,h}=setupCanvas(cv);
  const s=M.map[G.sel],end=M.day;
  const n=G.range==='ALL'?end+1:RANGES[G.range];
  const start=Math.max(0,end-n+1),count=end-start+1;
  const padL=8,padR=66,padT=22,padB=24,plotW=w-padL-padR;
  const volH=Math.round((h-padT-padB)*.17),priceH=h-padT-padB-volH-8;
  const line=count>200;
  let lo=Infinity,hi=-Infinity,vmax=0;
  for(let i=start;i<=end;i++){const a=line?s.C[i]:s.L[i],b=line?s.C[i]:s.H[i];if(a<lo)lo=a;if(b>hi)hi=b;if(s.V[i]>vmax)vmax=s.V[i]}
  const pd=(hi-lo)*.08||hi*.02;lo-=pd;hi+=pd;
  const bw=plotW/count,X=i=>padL+(i-start+.5)*bw,Y=p=>padT+(hi-p)/(hi-lo)*priceH;
  ctx.font='10.5px "JetBrains Mono", monospace';ctx.textBaseline='middle';
  const st=niceStep(hi-lo,5);
  for(let v=Math.ceil(lo/st)*st;v<=hi;v+=st){const y=Math.round(Y(v))+.5;ctx.strokeStyle=C.grid;ctx.lineWidth=1;ctx.beginPath();ctx.moveTo(padL,y);ctx.lineTo(w-padR,y);ctx.stroke();ctx.fillStyle=C.dim;ctx.textAlign='left';ctx.fillText(axisFmt(v,st),w-padR+8,y)}
  const vBase=h-padB;
  for(let i=start;i<=end;i++){const vh=s.V[i]/vmax*volH,up=s.C[i]>=(i>0?s.C[i-1]:s.O[i]);ctx.fillStyle=up?C.upA:C.downA;const bwid=Math.max(1,bw*.7);ctx.fillRect(X(i)-bwid/2,vBase-vh,bwid,vh)}
  if(line){
    const up=s.C[end]>=s.C[start],col=up?C.up:C.down;
    const g=ctx.createLinearGradient(0,padT,0,padT+priceH);g.addColorStop(0,up?'rgba(32,199,135,.22)':'rgba(240,80,110,.22)');g.addColorStop(1,'rgba(0,0,0,0)');
    ctx.beginPath();for(let i=start;i<=end;i++){const x=X(i),y=Y(s.C[i]);i===start?ctx.moveTo(x,y):ctx.lineTo(x,y)}
    ctx.strokeStyle=col;ctx.lineWidth=1.5;ctx.stroke();
    ctx.lineTo(X(end),padT+priceH);ctx.lineTo(X(start),padT+priceH);ctx.closePath();ctx.fillStyle=g;ctx.fill();
  }else{
    const cw=Math.max(1,Math.min(14,bw*.66));
    for(let i=start;i<=end;i++){
      const o=s.O[i],c=s.C[i],up=c>=o,col=up?C.up:C.down,x=Math.round(X(i))+.5;
      ctx.strokeStyle=col;ctx.lineWidth=1;ctx.beginPath();ctx.moveTo(x,Y(s.H[i]));ctx.lineTo(x,Y(s.L[i]));ctx.stroke();
      const y1=Y(Math.max(o,c)),y2=Y(Math.min(o,c));ctx.fillStyle=col;ctx.fillRect(x-cw/2,y1,cw,Math.max(1,y2-y1));
    }
  }
  const maN=line?200:50;
  if(end-start>=20){ctx.beginPath();let started=false;let sum=0;
    for(let i=Math.max(0,start-maN+1);i<=end;i++){sum+=s.C[i];if(i-maN>=0)sum-=s.C[i-maN];if(i>=start&&i>=maN-1){const x=X(i),y=Y(sum/maN);started?ctx.lineTo(x,y):ctx.moveTo(x,y);started=true}}
    ctx.strokeStyle=C.gold;ctx.globalAlpha=.75;ctx.lineWidth=1.2;ctx.stroke();ctx.globalAlpha=1}
  setHTML($('#cLegend'),`<span><i style="background:${C.gold}"></i>${maN}-day average</span><span><i style="background:${C.accent};height:6px;width:6px;border-radius:50%"></i>your trades</span>${s.kind==='stock'?`<span>E = earnings</span>`:''}`);
  if(s.earn){ctx.font='600 9px Inter, sans-serif';ctx.textAlign='center';ctx.textBaseline='middle';
    for(const e of s.earn){if(e.d<start||e.d>end)continue;const x=X(e.d),y=padT+priceH-7;ctx.fillStyle=e.react>=0?'rgba(32,199,135,.25)':'rgba(240,80,110,.25)';ctx.beginPath();ctx.arc(x,y,6,0,7);ctx.fill();ctx.fillStyle=C.text;ctx.fillText('E',x,y+.5)}}
  for(let k=P.tx.length-1;k>=0;k--){const t=P.tx[k];if(t.d<start)break;if(t.t!==s.t||(t.type!=='BUY'&&t.type!=='SELL'))continue;

/* ---------- generic line chart (performance) ---------- */
function lineChart(cv,series,yfmt,dateOf,hover,tipEl){
  const {ctx,w,h}=setupCanvas(cv);const n=series[0].data.length;
  const padL=8,padR=72,padT=14,padB=24,plotW=w-padL-padR,plotH=h-padT-padB;
  if(n<2){ctx.fillStyle=C.muted;ctx.font='13px Inter, sans-serif';ctx.textAlign='center';ctx.fillText('Advance time to start tracking your performance.',w/2,h/2);cv._geo=null;if(tipEl)tipEl.style.display='none';return}
  let lo=Infinity,hi=-Infinity;for(const s of series)for(const v of s.data){if(v<lo)lo=v;if(v>hi)hi=v}
  const pd=(hi-lo)*.08||Math.abs(hi)*.05||1;lo-=pd;hi+=pd;
  const X=i=>padL+i/(n-1)*plotW,Y=v=>padT+(hi-v)/(hi-lo)*plotH;
  const st=niceStep(hi-lo,5);ctx.font='10.5px "JetBrains Mono", monospace';ctx.textBaseline='middle';
  for(let v=Math.ceil(lo/st)*st;v<=hi+1e-9;v+=st){const y=Math.round(Y(v))+.5;ctx.strokeStyle=Math.abs(v)<st/1e6?'#3a465c':C.grid;ctx.lineWidth=1;ctx.beginPath();ctx.moveTo(padL,y);ctx.lineTo(w-padR,y);ctx.stroke();ctx.fillStyle=C.dim;ctx.textAlign='left';ctx.fillText(yfmt(v),w-padR+8,y)}
  for(const s of series){
    ctx.beginPath();s.data.forEach((v,i)=>{const x=X(i),y=Y(v);i?ctx.lineTo(x,y):ctx.moveTo(x,y)});
    ctx.strokeStyle=s.color;ctx.lineWidth=s.w||1.6;ctx.setLineDash(s.dash?[4,4]:[]);ctx.stroke();ctx.setLineDash([]);
    if(s.fill){ctx.lineTo(X(n-1),padT+plotH);ctx.lineTo(X(0),padT+plotH);ctx.closePath();const g=ctx.createLinearGradient(0,padT,0,padT+plotH);g.addColorStop(0,'rgba(91,140,255,.2)');g.addColorStop(1,'rgba(91,140,255,0)');ctx.fillStyle=g;ctx.fill()}
  }
  dateLabels(ctx,0,n-1,X,h-6,plotW,dateOf,padL);
  cv._geo={padL,plotW,n};
  if(tipEl){
    if(hover!=null&&hover>=0&&hover<n){
      const x=Math.round(X(hover))+.5;ctx.strokeStyle='rgba(200,210,230,.35)';ctx.setLineDash([2,3]);ctx.beginPath();ctx.moveTo(x,padT);ctx.lineTo(x,h-padB);ctx.stroke();ctx.setLineDash([]);
      for(const s of series){ctx.fillStyle=s.color;ctx.beginPath();ctx.arc(x,Y(s.data[hover]),3.5,0,7);ctx.fill()}
      tipEl.innerHTML=`<div style="color:${C.muted};margin-bottom:3px">${fmtDate(dateOf(hover))}</div>`+series.map(s=>`<div><span style="color:${s.color}">●</span> ${s.label}: <b>${yfmt(s.data[hover],true)}</b></div>`).join('');
      tipEl.style.display='block';const tw=tipEl.offsetWidth;tipEl.style.left=(x+14+tw>w?x-tw-10:x+14)+'px';tipEl.style.top='14px';
    }else tipEl.style.display='none';
  }
}

function realizedBeta(s){
  const d=M.day,a=Math.max(1,d-251);let k=0,mx=0,my=0;const xs=[],ys=[];
  for(let i=a;i<=d;i++){const x=M.H.idx[i]/M.H.idx[i-1]-1,y=s.C[i]/s.C[i-1]-1;xs.push(x);ys.push(y);mx+=x;my+=y;k++}
  mx/=k;my/=k;let c=0,v=0;for(let i=0;i<k;i++){c+=(xs[i]-mx)*(ys[i]-my);v+=(xs[i]-mx)**2}return v>0?c/v:NaN;
}

function quickFill(frac){

  if(type==='market'){
    const f=execPx(s,side,qty,px);
    if(side==='buy'){if(qty*f>buyingPower()+.005)return hint(`Not enough ${S.margin?'buying power':'cash'}: this needs ${fmt$(qty*f)}.`,true);buy(s.t,qty,f,px,'Market order');toast('Order filled',`Bought ${qty.toLocaleString()} ${s.t} @ ${fmt$(f)} · ${fmt$(qty*f)}`,'good')}
    else{const g=sell(s.t,qty,f,px,'Market order');toast('Order filled',`Sold ${qty.toLocaleString()} ${s.t} @ ${fmt$(f)} · ${g>=0?'gain':'loss'} ${sgn$(g)}`,g>=0?'good':'bad')}
  }else{
    const lp=round2(+$('#oPx').value);
    if(!(lp>0))return hint(`Enter a ${type} price.`,true);
    if(type==='stop'&&side==='sell'&&lp>=px)return hint('A sell stop must be below the current price. To sell higher, use a limit order.',true);
    if(type==='stop'&&side==='buy'&&lp<=px)return hint('A buy stop must be above the current price. To buy lower, use a limit order.',true);
    if(side==='buy'&&qty*lp>buyingPower())return hint(`This order needs ${fmt$(qty*lp)} but you only have ${fmt$(buyingPower())} of buying power.`,true);
    P.orders.push({id:P.oid++,t:s.t,side,type,qty,px:lp,d:M.day});
    toast('Order placed',`${side==='buy'?'Buy':'Sell'} ${qty} ${s.t} ${type} @ ${fmt$(lp)}. Checked each trading day until filled or cancelled.`,'info');
  }
  resetTicket();G.dirty=true;save();
}

function showEnd(bankrupt){
  const s=stats(),diff=s.cagr-s.bcagr;
  let grade,msg;
  if(bankrupt){grade='Wiped out';msg='Your account value hit zero. Leverage and concentration are a dangerous combination.'}
  else if(!isFinite(diff)){grade='Done';msg=''}
  else if(diff>.03){grade='Legendary investor';msg='You beat the market by more than 3 points a year. Very few professionals manage that over a decade.'}
  else if(diff>0){grade='You beat the market';msg='You outperformed the index after costs and taxes. That is genuinely hard to do.'}
  else if(diff>-.01){grade='Matched the market';msg='You kept pace with the index. Not bad, but an index fund would have done the same with no effort.'}
  else {grade='The market won';msg='You trailed the index. You\'re in good company: most active investors do. Costs, taxes and bad timing add up.'}
  const r=(l,v,c)=>`<div><small>${l}</small><b class="${c||''}">${v}</b></div>`;
  showModal(`<h1>${bankrupt?'Game over':`${S.years}-year results`}</h1><div class="grade ${bankrupt||diff<-.01?'down':diff>0?'up':''}">${grade}</div><p>${msg}</p>

function pause(){if(G.playing){G.playing=false;G.dirty=true;save()}}
function play(){if(G.demo){showStart();return}if(P.over)return;G.playing=true;G.dirty=true}
function stepDays(n){if(G.demo){showStart();return}pause();G.pauseReq=false;for(let i=0;i<n;i++){const before=G.modal;if(!advance(true))break;if(G.pauseReq||G.modal!==before)break}G.pauseReq=false;G.dirty=true;save()}

function handleAction(e){
  const tg=e.target;if(tg.closest('input,select,label.chk'))return false;
  let el;
  if((el=tg.closest('[data-cancel]'))){P.orders=P.orders.filter(o=>o.id!==+el.dataset.cancel);G.dirty=true;save();return true}
  if((el=tg.closest('[data-sel]'))){selectSec(el.dataset.sel);return true}
  if((el=tg.closest('[data-tab]'))){G.tab=el.dataset.tab;G.dirty=true;return true}
  if((el=tg.closest('[data-range]'))){G.range=el.dataset.range;G.hov=null;G.dirty=true;return true}
  if((el=tg.closest('[data-side]'))){G.side=el.dataset.side;resetTicket();G.dirty=true;return true}
  if((el=tg.closest('[data-q]'))){quickFill(+el.dataset.q);return true}
  if((el=tg.closest('[data-speed]'))){G.speed=+el.dataset.speed;play();return true}
  if((el=tg.closest('[data-adv]'))){stepDays(+el.dataset.adv);return true}
  if((el=tg.closest('[data-nf]'))){G.newsF=el.dataset.nf;G.dirty=true;return true}
  if((el=tg.closest('[data-pm]'))){G.perfMode=el.dataset.pm;G.phov=null;G.dirty=true;return true}
  if((el=tg.closest('[data-lf]'))){G.listF=el.dataset.lf;G.dirty=true;return true}
  if((el=tg.closest('[data-act]'))){doAct(el.dataset.act);return true}
  return false;
}
function doAct(a){
  switch(a){
    case 'play':G.playing?pause():play();break;
    case 'submit':submitOrder();break;
    case 'help':showHelp();break;
    case 'back':showStart();break;
    case 'menu':if(G.demo)showStart();else showMenu();break;
    case 'close':hideModal();break;
    case 'applyMenu':S.contrib=+$('#mContrib').value;S.autoPause=$('#mAuto').checked;save();hideModal();G.dirty=true;break;
    case 'newgame':if(!G.demo&&!P.over&&!P.ended&&!confirm('Start a new game? Your current game will be overwritten.'))return;showStart();break;
    case 'continue':{const sv=readSave();if(sv){loadGame(sv);hideModal();resetTicket();toast('Welcome back',`Resuming on ${fmtDate(M.dates[M.day])}.`,'info')}break}
    case 'start':{
      const seedIn=$('#ngSeed').value.trim();const seed=/^\d+$/.test(seedIn)?(+seedIn%4294967296):Math.floor(Math.random()*1e9);
      const acct=$('#ngAcct').value;
      newGame({cash:+$('#ngCash').value,years:+$('#ngYears').value,contrib:+$('#ngContrib').value,acct,margin:$('#ngMargin').checked&&acct==='taxable',seed});
      hideModal();toast('Market open',`You have ${fmt$(S.cash,0)} to invest. Pick something on the left, or press ▶ to let time pass.`,'good');break}
    case 'endless':S.years=0;save();hideModal();G.dirty=true;break;
    case 'viewperf':hideModal();G.tab='perf';G.dirty=true;break;
  }
  G.dirty=true;
}

document.addEventListener('pointerdown',e=>{if(e.pointerType==='mouse'&&e.button===0&&!e.target.closest('#modal')){if(handleAction(e))G.pdAt=performance.now()}});
document.addEventListener('click',e=>{if(performance.now()-G.pdAt<700&&!e.target.closest('#modal'))return;handleAction(e)});
$('#modalBg').addEventListener('pointerdown',e=>{if(e.target.id==='modalBg'&&!G.demo&&P&&!P.over&&!P.ended)hideModal()});
['oQty','oPx'].forEach(id=>$('#'+id).addEventListener('input',()=>{if(id==='oQty'){const q=Math.floor(+$('#oQty').value)||0,s=M.map[G.sel];$('#oAmt').value=q?(q*(+$('#oPx').value||s.C[M.day])).toFixed(2):''}renderTicket()}));
$('#oAmt').addEventListener('input',()=>{const s=M.map[G.sel],amt=+$('#oAmt').value||0,ref=$('#oType').value==='market'?s.C[M.day]:(+$('#oPx').value||s.C[M.day]);let q=Math.floor(amt/ref);if(G.side==='buy')while(q>0&&q*execPx(s,'buy',q,ref)>amt)q--;$('#oQty').value=q||'';renderTicket()});
$('#oType').addEventListener('change',()=>{const s=M.map[G.sel];if($('#oType').value!=='market'&&!$('#oPx').value)$('#oPx').value=s.C[M.day].toFixed(2);renderTicket()});
$$('.ticket input').forEach(i=>i.addEventListener('keydown',e=>{if(e.key==='Enter')submitOrder()}));
document.addEventListener('keydown',e=>{
  if(e.target.closest('input,select,textarea'))return;
  if(G.modal){if(e.key==='Escape'&&!G.demo&&P&&!P.over&&!P.ended)hideModal();return}
  if(e.code==='Space'){e.preventDefault();G.playing?pause():play()}
  else if(e.key==='ArrowRight'){e.preventDefault();stepDays(1)}
});
const cv=$('#chart');
cv.addEventListener('mousemove',e=>{const g=cv._geo;if(!g)return;const x=e.clientX-cv.getBoundingClientRect().left;const i=g.start+Math.floor((x-g.padL)/g.bw);const ni=i>=g.start&&i<=g.end?i:null;if(ni!==G.hov){G.hov=ni;drawPriceChart()}});
cv.addEventListener('mouseleave',()=>{G.hov=null;drawPriceChart()});
document.addEventListener('mousemove',e=>{const pc=e.target.id==='perfChart'?e.target:null;if(!pc){if(G.phov!=null){G.phov=null;drawPerf()}return}const g=pc._geo;if(!g)return;const x=e.clientX-pc.getBoundingClientRect().left;const i=Math.round((x-g.padL)/g.plotW*(g.n-1));const ni=i>=0&&i<g.n?i:null;if(ni!==G.phov){G.phov=ni;drawPerf()}});
window.addEventListener('resize',()=>{G.dirty=true});
document.addEventListener('visibilitychange',()=>{if(document.hidden){pause();save()}});
window.addEventListener('beforeunload',save);

/* ======================= main loop ======================= */
let acc=0,lastT=performance.now(),lastR=0;
function frame(now){
  const dt=Math.min(.25,(now-lastT)/1000);lastT=now;
  if(G.playing&&!G.modal){acc+=dt*SPEEDS[G.speed];let k=0;while(acc>=1&&G.playing&&k<8){acc-=1;advance(true);k++}}else acc=Math.min(acc,.999);
  if(G.dirty&&(!G.playing||now-lastR>90)){G.dirty=false;lastR=now;renderAll()}
  requestAnimationFrame(frame);
}

/* ======================= boot ======================= */
readColors();
{const sv=readSave();
 if(sv){try{loadGame(sv)}catch(err){newGame({cash:10000,years:10,contrib:500,acct:'taxable',margin:false,seed:12345},true)}}
 else newGame({cash:10000,years:10,contrib:500,acct:'taxable',margin:false,seed:Math.floor(Math.random()*1e9)},true);
 renderAll();showStart();}
requestAnimationFrame(frame);
</script>
</body>
